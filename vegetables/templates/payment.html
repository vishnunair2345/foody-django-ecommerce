{% extends 'indexheader.html' %}
{% load static %}
{% block b1 %}

<style>
  body {
    background: #f9f9f9;
    font-family: "Poppins", sans-serif;
  }

  .payment-container {
    max-width: 600px;
    margin: 50px auto;
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    padding: 30px 40px;
    animation: fadeIn 0.6s ease;
  }

  h2 {
    text-align: center;
    margin-bottom: 25px;
    color: #222;
    font-size: 26px;
    font-weight: 600;
  }

  .form-group {
    margin-bottom: 18px;
  }

  label {
    display: block;
    font-weight: 500;
    color: #444;
    margin-bottom: 6px;
  }

  input, select, textarea {
    width: 100%;
    padding: 10px 14px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 15px;
    transition: border-color 0.3s ease;
  }

  input:focus, select:focus, textarea:focus {
    outline: none;
    border-color: #00bfa5;
  }

  .total-section {
    background: #f0fdf6;
    border-left: 5px solid #00c853;
    padding: 15px;
    margin: 20px 0;
    border-radius: 6px;
    font-size: 18px;
    font-weight: 600;
    color: #333;
  }

  .pay-btn {
    display: block;
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 30px;
    background: linear-gradient(90deg, #00c853, #00bfa5);
    color: #fff;
    font-size: 17px;
    font-weight: 600;
    letter-spacing: 0.5px;
    cursor: pointer;
    box-shadow: 0 4px 12px rgba(0,191,165,0.3);
    transition: all 0.3s ease;
  }

  .pay-btn:hover {
    transform: scale(1.03);
    box-shadow: 0 6px 18px rgba(0,191,165,0.4);
    background: linear-gradient(90deg, #00e676, #1de9b6);
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>

<div class="payment-container">
  <h2>Proceed to Payment 💳</h2>

  <form method="POST" action="{% url 'payment' %}">
    {% csrf_token %}

    <div class="form-group">
      <label for="name">Full Name</label>
      <input type="text" id="name" name="name" value="{{ user.name }}" required>
    </div>

    <div class="form-group">
      <label for="email">Email Address</label>
      <input type="email" id="email" name="email" value="{{ user.email }}" required placeholder="example@email.com">
    </div>

    <div class="form-group">
      <label for="address">Delivery Address</label>
      <textarea id="address" name="address" rows="3" required>{{ user.place }}</textarea>
    </div>

    <div class="form-group">
      <label for="payment_method">Payment Method</label>
      <select id="payment_method" name="payment_method" required>
        <option value="">-- Select Payment Method --</option>
        <option value="upi">UPI</option>
        <option value="credit">Credit Card</option>
        <option value="debit">Debit Card</option>
        <option value="cod">Cash on Delivery</option>
      </select>
    </div>

    <div class="total-section">
      Total Amount: ₹{{ total_price }}
    </div>
      <input type="hidden" name="total_amount" value="{{ total_price }}">

    <button type="submit" class="pay-btn">Pay Now</button>
  </form>
</div>

{% endblock %}
