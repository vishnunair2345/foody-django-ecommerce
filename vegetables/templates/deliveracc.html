{% extends 'homeheader.html' %}
{% load static %}
{% block b1 %}
    <style>
      body {
            font-family: 'Poppins', sans-serif;
            background: #f0f2f5;
            margin: 0;
            padding: 0;
        }

        /* Center only the form in middle section */
        .content-wrapper {
            min-height: calc(100vh - 200px); /* Adjust based on header+footer height */
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 0;
        }

        .register-container {
            background: #ffffff;
            padding: 40px 35px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            width: 400px;
            transition: 0.3s ease;
        }

        .register-container:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 35px rgba(0,0,0,0.15);
        }

        .register-container h2 {
            text-align: center;
            margin-bottom: 25px;
            color: #333;
            font-weight: 600;
        }

        .register-container input {
            width: 100%;
            padding: 14px 15px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 12px;
            font-size: 15px;
            background: #fff;
            transition: all 0.3s ease;
            box-sizing: border-box;
        }

        .register-container input:focus {
            border-color: #6c63ff;
            box-shadow: 0 0 8px rgba(108,99,255,0.2);
            outline: none;
        }

        input:-webkit-autofill,
        input:-webkit-autofill:hover,
        input:-webkit-autofill:focus,
        input:-webkit-autofill:active {
            -webkit-box-shadow: 0 0 0px 1000px #fff inset !important;
            -webkit-text-fill-color: #000 !important;
            transition: background-color 5000s ease-in-out 0s;
        }

        .register-container button {
            width: 100%;
            padding: 14px;
            background: #6c63ff;
            color: white;
            font-size: 16px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            margin-top: 15px;
            transition: background 0.3s ease, transform 0.2s ease;
        }

        .register-container button:hover {
            background: #5950d4;
            transform: translateY(-2px);
        }
        .register-container textarea {
    width: 100%;
    padding: 14px 15px;
    margin: 10px 0;
    border: 1px solid #ddd;
    border-radius: 12px;
    font-size: 15px;
    background: #fff;
    transition: all 0.3s ease;
    box-sizing: border-box;
    resize: none; /* optional: prevents resizing */
}

.register-container textarea:focus {
    border-color: #6c63ff;
    box-shadow: 0 0 8px rgba(108,99,255,0.2);
    outline: none;
}
        .footer-links {
  text-align: center;
  margin-top: 20px;
  font-size: 14.5px;
  color: #555;
}

.footer-links a {
  color: #6c63ff;
  text-decoration: none;
  font-weight: 600;
  transition: all 0.3s ease;
  margin-left: 6px;
}

.footer-links a:hover {
  color: #4f46e5;
  text-decoration: underline;
}
    </style>

    <div class="content-wrapper">
        <div class="register-container">
            <h2>Create Account</h2>
            <form method="POST" action="/delacc/">
                {% csrf_token %}
                <input type="text" name="name" placeholder="Full Name" required>
                <input type="number" name="age" placeholder="Age" required>
                <textarea name="place" placeholder="Place of Residence" rows="3" required></textarea>
                <input type="tel" name="phone" placeholder="Phone Number" required>
                <input type="email" name="email" placeholder="Email Address" required>
                <input type="password" name="password" placeholder="Create Password" required>
                <button type="submit">Register</button>

                 <div class="footer-links">
      <p>Already have an account? <a href="/dellogin/">Login here</a></p>
    </div>

            </form>
        </div>
    </div>
{% endblock %}
