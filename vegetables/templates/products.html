                            <div class="product-item">

                                <div class="position-relative bg-light overflow-hidden">
                                    <img class="img-fluid w-100 height-70" src="{{ i.image.url }}" alt="" style="height: 200px; object-fit: cover;">

                                </div>

                                <div class="text-center p-4">
                                    <a class="d-block h5 mb-2" value="{{ i.name }}">{{ i.name }}</a>

                                </div>

                                    <small class="w-100 text-center py-2">
                                        <a class="text-body" href="{% url 'cart' i.id %}"><i class="fa fa-shopping-bag text-primary m-2"></i>Add to cart</a>
                                    </small>
                                </div>

                            </div>
                        </div>
                        {% endfor %}
