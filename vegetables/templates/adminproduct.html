{% extends 'adminheader.html' %}
{% load static %}
{% block b1 %}

<!-- Bootstrap CSS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- Custom Styles -->
<style>

  :root {
    --card-radius: 14px;
    --green-main: #21b573;
    --green-hover: #18a965;
  }


  .header-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 25px;
  }

  h1.title {
    font-size: 26px;
    font-weight: 700;
    margin: 0;
  }

  .add-btn {
    background: var(--green-main);
    border: none;
    color: #fff;
    padding: 10px 18px;
    border-radius: 8px;
    box-shadow: 0 6px 14px rgba(33,181,115,0.18);
    font-size: 15px;
    transition: 0.2s;
  }

  .add-btn:hover {
    background: var(--green-hover);
  }

  .search-wrap {
    margin-bottom: 20px;
  }

  .form-control {
    border-radius: 10px;
    height: 46px;
    padding: 10px 15px;
    border: 1px solid #ddd;
    font-size: 15px;
  }

  /* Table Styling */
  table {
    width: 400px;
    border-collapse: separate;
    border-spacing: 0 10px;
  }

  thead th {
    padding: 12px 10px;
    background: #f7f7f7;
    font-weight: 600;
    color: #555;
  }

  tbody tr {
    background: #fff;
    border-radius: 10px;
    box-shadow: 0px 4px 10px rgba(0,0,0,0.05);
  }

  tbody td {
    padding: 18px 12px;
    vertical-align: middle;
  }

  tbody td:first-child {
    border-radius: 10px 0 0 10px;
  }

  tbody td:last-child {
    border-radius: 0 10px 10px 0;
  }

  .btn-edit {
    background: #2b7be3;
    color: #fff;
    border-radius: 8px;
    padding: 8px 12px;
    border: none;
    font-size: 14px;
  }

  .btn-delete {
    background: #e25b5b;
    color: #fff;
    border-radius: 8px;
    padding: 8px 12px;
    border: none;
    font-size: 14px;
  }

  /* Modal Styling */
  .modal-content {
    border-radius: 18px;
    padding: 20px 15px;
    box-shadow: 0 25px 60px rgba(0,0,0,0.25);
  }

  .modal-title {
    font-size: 28px;
    font-weight: 700;
  }

  .upload-box {
    border: 2px dashed #cfcfcf;
    height: 65px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    padding-left: 15px;
    font-size: 16px;
    color: #666;
  }

  .btn-cancel {
    background: #6c757d;
    color: #fff;
    padding: 10px 30px;
    border-radius: 8px;
    font-size: 15px;
    border: none;
  }

  .btn-add {
    background: var(--green-main);
    color: #fff;
    padding: 10px 30px;
    border-radius: 8px;
    font-size: 15px;
    border: none;
  }

  .btn-add:hover {
    background: var(--green-hover);
  }

  /* Responsive */
  @media(max-width: 600px) {
    .header-row {
      flex-direction: column;
      align-items: flex-start;
      gap: 12px;
    }

    .add-btn {
      width: 100%;
      text-align: center;
    }
  }


.page-card {
   background: #fff;
    padding: 30px;
    border-radius: 15px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.12);
    max-width: 1800px; /* Increased width */
    margin: 90px 350px; /* This centers it within its available parent space */
    width: 90%; /* Added to ensure it doesn't try to exceed the viewport */



}

</style>

<!-- Main Content -->
<div class="center-wrapper">

<div class="page-card">
  <div class="header-row">
    <h1 class="title">Products</h1>
    <button class="add-btn" data-bs-toggle="modal" data-bs-target="#addProductModal">Add New Product</button>
  </div>

  <div class="search-wrap">
    <input class="form-control" placeholder="Search users by name, email, or ID..." />
  </div>

  <div class="table-responsive">
    <table class="table align-middle mb-0">
      <thead>
        <tr>
          <th class="id-col">ID</th>
          <th class="image-col">Image</th>
          <th class="name-col">Name</th>
          <th class="price-col">Price</th>
          <th style="width:220px">Actions</th>
        </tr>
      </thead>
      <tbody>
      {%for v in veg %}
        <tr>
          <td>{{ v.id }}</td>
          <td><img src="{{ v.image.url }}" style="width:60px;height:60px;border-radius:8px;object-fit:cover;"></td>
          <td>{{ v.name }}</td>
          <td>{{ v.price }}</td>
          <td>
         <button class="btn-edit me-2"
        data-bs-toggle="modal"
        data-bs-target="#editModal{{ v.id }}">
    Edit
</button>

          <a href="{% url 'delproduct' v.id %}" > <button class="btn-delete">Delete</button></a>
          </td>
        </tr>
      {% endfor %}
      </tbody>
    </table>
  </div>
</div>

    <!-- Edit Product Modal -->

{% for v in veg %}
<div class="modal fade" id="editModal{{ v.id }}" tabindex="-1">
  <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
    <div class="modal-content">

      <form method="POST" enctype="multipart/form-data" action="{% url 'editproduct' v.id %}">
        {% csrf_token %}

        <div class="modal-header border-0">
          <h4 class="modal-title">Edit Product</h4>
          <button class="btn-close" data-bs-dismiss="modal"></button>
        </div>

        <div class="modal-body">

          <label class="form-label fw-bold">Product Name *</label>
          <input type="text" class="form-control mb-4" name="pname" value="{{ v.name }}" required>

          <label class="form-label fw-bold">Current Image</label><br>
          <img src="{{ v.image.url }}" width="80" height="80"
               style="border-radius:10px;object-fit:cover;margin-bottom:10px;">

          <label class="form-label fw-bold mt-3">Change Image (optional)</label>
          <div class="upload-box mb-4">
            <input type="file" name="pimage">
          </div>

          <label class="form-label fw-bold">Price *</label>
          <input type="text" class="form-control mb-4" name="pprice" value="{{ v.price }}" required>

        </div>

        <div class="modal-footer border-0">
          <button type="button" class="btn-cancel" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn-add">Save Changes</button>
        </div>

      </form>

    </div>
  </div>
</div>
{% endfor %}


<!-- Add Product Modal -->
<div class="modal fade" id="addProductModal" tabindex="-1">
  <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
    <div class="modal-content">

      <form method="POST" enctype="multipart/form-data" action="{% url 'adminpro' %}">
        {% csrf_token %}

        <div class="modal-header border-0">
          <h4 class="modal-title">Add New Product</h4>
          <button class="btn-close" data-bs-dismiss="modal"></button>
        </div>

        <div class="modal-body">

          <label class="form-label fw-bold">Product Name *</label>
          <input type="text" class="form-control mb-4" name="pname" placeholder="Enter product name" required>

          <label class="form-label fw-bold">Product Image *</label>
          <div class="upload-box mb-4">
            <input type="file" name="pimage" required>
          </div>

          <label class="form-label fw-bold">Price *</label>
          <input type="text" class="form-control mb-4" name="pprice" placeholder="e.g., ₹99" required>

        </div>

        <div class="modal-footer border-0">
          <button type="button" class="btn-cancel" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn-add">Add Product</button>
        </div>

      </form>

    </div>
  </div>
</div>


<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<!-- Search Filter Script -->
<script>
  const searchInput = document.querySelector('.form-control');
  const rows = document.querySelectorAll('tbody tr');

  searchInput.addEventListener('keyup', function() {
    const value = this.value.toLowerCase();
    rows.forEach(row => {
      row.style.display = row.innerText.toLowerCase().includes(value) ? '' : 'none';
    });
  });
</script>

{% endblock %}
