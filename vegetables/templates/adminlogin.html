<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Login</title>

<style>
    body {
        margin: 0;
        padding: 0;
        font-family: "Inter", sans-serif;
        background: #f1f5fb;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
    }

    .login-card {
        width: 420px;
        background: #ffffff;
        padding: 50px;
        border-radius: 20px;
        box-shadow: 0 10px 40px rgba(0,0,0,0.08);
        padding-right:70px;
    }

    h2 {
        margin: 0;
        font-size: 24px;
        font-weight: 700;
        color: #111827;
    }

    .subtitle {
        margin: 6px 0 25px;
        color: #6b7280;
        font-size: 14px;
    }

    label {
        display: block;
        margin-bottom: 6px;
        font-weight: 500;
        font-size: 14px;
        color: #374151;
    }

    input {
        width: 100%;
        padding: 12px 12px;
        font-size: 14px;
        border: 1px solid #d9e2ec;
        border-radius: 10px;
        background: #f9fafb;
        margin-bottom: 18px;
    }

    input:focus {
        outline: none;
        border-color: #3b82f6;
        background: #ffffff;
    }

    .row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 18px;
    }

    .row label {
        display: flex;
        align-items: center;
        gap: 5px;
        margin: 0;
    }

    .row a {
        font-size: 14px;
        color: #2563eb;
        text-decoration: none;
    }

    .btn-primary {
        background: #2563eb;
        border: none;
        color: white;
        padding: 10px 18px;
        font-size: 15px;
        font-weight: 600;
        border-radius: 8px;
        cursor: pointer;
    }

    .btn-primary:hover {
        background: #1e4fd6;
    }

    .btn-reset {
        background: none;
        border: none;
        color: #2563eb;
        font-size: 15px;
        cursor: pointer;
        margin-left: 10px;
    }
</style>
</head>

<body>

<div class="login-card">

    <h2>Admin Login</h2>
    <p class="subtitle">Enter your administrator credentials to continue.</p>

    <form method="post" action="{% url 'adminlogin' %}">
        {% csrf_token %}

        <label>Username</label>
        <input type="text" placeholder="admin" name="username" required>

        <label>Password</label>
        <input type="password" name="password" placeholder="••••••••" required>

<!--        <div class="row">-->
<!--            <label><input type="checkbox"> Remember me</label>-->
<!--            <a href="#">Forgot?</a>-->
<!--        </div>-->

        <button type="submit" class="btn-primary">Sign in</button>
<!--        <button type="reset" class="btn-reset">Reset</button>-->

    </form>
</div>

</body>
</html>
