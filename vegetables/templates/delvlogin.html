{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Delivery Access</title>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #00C853;
      --primary-glow: #00E676;
      --text: #1a1a1a;
      --text-light: #555;
      --border: #e0e0e0;
      --bg: #ffffff;
      --card-bg: #ffffff;
      --shadow: 0 15px 40px rgba(0, 0, 0, 0.08);
      --transition: all 0.35s ease;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      position: relative;
    }

    body::before {
      content: '';
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background:
        radial-gradient(circle at 20% 80%, rgba(0, 200, 83, 0.03) 0%, transparent 50%),
        radial-gradient(circle at 80% 20%, rgba(0, 200, 83, 0.03) 0%, transparent 50%);
      z-index: -1;
    }

    .login-container {
      background: var(--card-bg);
      border-radius: 24px;
      width: 100%;
      max-width: 440px;
      padding: 50px 40px;
      box-shadow: var(--shadow);
      border: 1px solid rgba(0, 0, 0, 0.06);
      animation: slideUp 0.7s ease-out;
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .logo-wrapper {
      text-align: center;
      margin-bottom: 28px;
    }

    .logo {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      object-fit: cover;
      border: 5px solid #f0f0f0;
      box-shadow: 0 8px 25px rgba(0, 200, 83, 0.15);
      transition: var(--transition);
    }

    .logo:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 35px rgba(0, 200, 83, 0.25);
    }

    h1 {
      text-align: center;
      font-size: 28px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 8px;
    }

    .tagline {
      text-align: center;
      font-size: 15px;
      color: var(--text-light);
      margin-bottom: 32px;
      font-weight: 500;
    }

    .form-group {
      position: relative;
      margin-bottom: 26px;
    }

    .form-group input {
      width: 100%;
      padding: 16px 18px;
      font-size: 15.5px;
      border: 2px solid var(--border);
      border-radius: 16px;
      background: #fdfdfd;
      color: var(--text);
      outline: none;
      transition: var(--transition);
      font-weight: 500;
    }

    /* Custom Placeholders */
    .form-group input::placeholder {
      color: #aaa;
      font-weight: 500;
      opacity: 1;
    }

    .form-group label {
      position: absolute;
      left: 18px;
      top: 16px;
      font-size: 15px;
      color: #777;
      pointer-events: none;
      transition: var(--transition);
      background: #fdfdfd;
      padding: 0 8px;
      font-weight: 500;
    }

    /* Floating Label: Only when focused or filled */
    .form-group input:focus ~ label,
    .form-group input:not(:placeholder-shown) ~ label {
      top: -11px;
      left: 14px;
      font-size: 12.5px;
      color: var(--primary);
      background: #ffffff;
      font-weight: 600;
      padding: 0 10px;
    }

    /* Focus & Glow Effect */
    .form-group input:focus,
    .form-group input:not(:placeholder-shown) {
      border-color: var(--primary);
      background: #ffffff;
      box-shadow:
        0 0 0 5px rgba(0, 200, 83, 0.12),
        0 8px 25px rgba(0, 200, 83, 0.1);
      transform: translateY(-1px);
    }

    .submit-btn {
      width: 100%;
      padding: 16px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 16px;
      font-size: 16.5px;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
      margin-top: 12px;
      position: relative;
      overflow: hidden;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .submit-btn::before {
      content: '';
      position: absolute;
      top: 0; left: -100%;
      width: 100%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
      transition: 0.6s;
    }

    .submit-btn:hover {
      background: #00B248;
      transform: translateY(-3px);
      box-shadow: 0 12px 30px rgba(0, 200, 83, 0.3);
    }

    .submit-btn:hover::before {
      left: 100%;
    }

    .footer-links {
      margin-top: 28px;
      text-align: center;
      font-size: 14px;
    }

    .footer-links a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 500;
      margin: 0 14px;
      transition: var(--transition);
    }

    .footer-links a:hover {
      color: #00A843;
      text-decoration: underline;
    }

    @media (max-width: 480px) {
      .login-container {
        padding: 40px 25px;
        margin: 10px;
      }
      h1 { font-size: 26px; }
      .logo { width: 80px; height: 80px; }
    }
  </style>
</head>
<body>

  <form class="login-container" method="post" action="/dellogin/">
    {% csrf_token %}

    <div class="logo-wrapper">
      <img src="{% static 'images/Blank Pfp.jpeg' %}" alt="Logo" class="logo">
    </div>

    <h1>Delivery Access</h1>
    <p class="tagline">Secure login for delivery partners</p>

    <!-- Username with Custom Placeholder -->
    <div class="form-group">
      <input
        type="text"
        id="username"
        name="username"
        placeholder="Enter your delivery ID or phone"
        required
      />
      <label for="username">Username</label>
    </div>

    <!-- Password with Custom Placeholder -->
    <div class="form-group">
      <input
        type="password"
        id="password"
        name="password"
        placeholder="Enter your secure password"
        required
      />
      <label for="password">Password</label>
    </div>

    <button type="submit" class="submit-btn">Login Now</button>

         <div class="footer-links">
      <p>Don't have an account? <a href="/delacc/">Create one</a></p>
    </div>


  </form>

</body>
</html>
